[package]
name = "pq-mtls-cost"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Costo medido de mTLS híbrido post-cuántico (X25519MLKEM768) contra X25519 con rustls"
rust-version = "1.85"
publish = false

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
